{% extends "base.html" %}

{% block title %}Cost Management - Hotel Management System{% endblock %}

{% block content %}
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Record Cost</h4>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <div class="alert alert-success">
                        {% for message in messages %}
                        {{ message }}<br>
                        {% endfor %}
                    </div>
                    {% endif %}
                    {% endwith %}
                    
                    <form action="{{ url_for('costs') }}" method="post">
                        <div class="form-group">
                            <label for="meeting_id">Meeting</label>
                            <select id="meeting_id" name="meeting_id" class="form-control" required>
                                <option value="">Select a meeting</option>
                                {% for meeting in meetings %}
                                <option value="{{ meeting.id }}">{{ meeting.title }} ({{ meeting.date.strftime('%Y-%m-%d') }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount</label>
                            <input type="number" id="amount" name="amount" class="form-control" step="0.01" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" name="description" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Record Cost</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
